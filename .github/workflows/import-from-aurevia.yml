name: Import Velyo from Aurevia

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-from-aurevia.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Velyo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout import branch
        run: |
          git fetch origin codex/velyo-site-complet
          git checkout -B codex/velyo-site-complet origin/codex/velyo-site-complet

      - name: Download Velyo source from Aurevia
        run: |
          git clone --depth 1 --branch codex/velyo-site-complet \
            https://github.com/antoinedavid23/Aurevia.git /tmp/velyo-source

      - name: Replace the branch contents
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude=.git /tmp/velyo-source/ ./
          rm -f .openai/hosting.json
          cat > .openai/README.md <<'EOF'
          # Velyo — dépôt indépendant

          Ce dépôt contient la version Velyo Property Manager, séparée du site Aurevia.
          La configuration d’hébergement Aurevia ne doit jamais être ajoutée ici.
          EOF

      - name: Commit and push the imported site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to import."
          else
            git commit -m "feat: import complete Velyo multipage website"
          fi
          git push --force-with-lease origin codex/velyo-site-complet

      - name: Open the Velyo pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr view codex/velyo-site-complet --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Pull request already exists."
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head codex/velyo-site-complet \
              --draft \
              --title "Velyo — site multipage basé sur l’architecture Aurevia" \
              --body "## Migration terminée\n\nCette pull request contient la version Velyo Property Manager dans son propre dépôt.\n\n### Structure conservée\n- accueil éditorial complet ;\n- services et fiches détaillées ;\n- expériences et fiches détaillées ;\n- parcours propriétaire ;\n- propriétés et fiches ;\n- simulateur, contact, estimation, FAQ et pages légales ;\n- administration et routes API.\n\n### Direction Velyo\n- aucun hero vidéo ;\n- identité noir, crème et or plus accessible ;\n- expériences locales de Genova ;\n- discours direct et orienté service.\n\nLa branche et la pull request temporaires du dépôt Aurevia peuvent maintenant être fermées."
          fi
